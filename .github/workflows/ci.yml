name: MasterAnnonce CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Optional Bonus 1: Matrix testing Java 17 and 21 (We're on 21 by default, let's keep it simple here)
    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: "maven"

      # Tests will run with Testcontainers automatically spinning up a PostgreSQL instance
      - name: Build with Maven
        run: mvn -B clean verify

      - name: Upload artifact
        if: matrix.java-version == 21
        uses: actions/upload-artifact@v4
        with:
          name: master-annonce-jar
          path: target/TP_AIR-1.0-SNAPSHOT.jar

  docker-bonus:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t master-annonce:latest .

      - name: Save Docker image as artifact
        run: docker save master-annonce:latest > master-annonce.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: master-annonce-docker
          path: master-annonce.tar
