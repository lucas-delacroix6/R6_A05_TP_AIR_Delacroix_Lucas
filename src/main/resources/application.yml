spring:
  application:
    name: TP_AIR

  datasource:
    url: jdbc:postgresql://localhost:5432/tp_air
    username: user
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false # Disabling redundant SQL logs from JPA to avoid "bruit", will let hibernate log only slowly if needed.
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

jwt:
  secret: a-very-long-secret-key-that-must-be-at-least-256-bits-long-for-hmac-sha256-secure-signing
  expirationMs: 86400000

logging:
  level:
    root: INFO
    com.example.tp_air: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [CorrId: %X{correlationId}] - %msg%n"
